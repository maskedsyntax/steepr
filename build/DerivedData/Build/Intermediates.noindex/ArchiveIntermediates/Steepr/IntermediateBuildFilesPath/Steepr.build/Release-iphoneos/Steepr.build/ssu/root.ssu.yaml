apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.maskedsyntax.Steepr
    intents:
    - metadata:
        name: StartTeaTimerIntent_0
        title: Start Tea Timer
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Start my ${TeaEntity} timer in ${+applicationName}'
          - '{${+prefix} }Brew ${TeaEntity} in ${+applicationName}'
    - metadata:
        name: PauseTeaTimerIntent_1
        title: Pause Tea Timer
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Pause my tea timer in ${+applicationName}'
    - metadata:
        name: StopTeaTimerIntent_2
        title: Stop Tea Timer
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Stop my tea timer in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Steepr
- name: TeaEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Tea
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml

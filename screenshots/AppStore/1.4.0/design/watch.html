<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1284, initial-scale=1">
  <title>Steepr 1.2.1 App Store artwork</title>
  <style>
    @font-face {
      font-family: "New York";
      src: url("file:///System/Library/Fonts/NewYork.ttf");
    }

    @font-face {
      font-family: "SF Pro";
      src: url("file:///System/Library/Fonts/SFNS.ttf");
    }

    :root {
      --forest: #123f2f;
      --forest-deep: #082f22;
      --cream: #f8f3e8;
      --sage: #a8b9a5;
      --lime: #66ad00;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1284px;
      height: 2778px;
      margin: 0;
      overflow: hidden;
      background: var(--cream);
    }

    body {
      font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      position: relative;
      display: none;
      width: 1284px;
      height: 2778px;
      overflow: hidden;
      isolation: isolate;
    }

    body[data-shot="hero"] .hero,
    body[data-shot="watch"] .watch { display: block; }

    .backdrop,
    .backdrop::after {
      position: absolute;
      inset: 0;
      content: "";
    }

    .hero .backdrop {
      background: url("assets/ivory-tea-background.png") center / cover no-repeat;
    }

    .hero .backdrop::after {
      background: linear-gradient(180deg, rgba(250,247,239,.08) 0%, rgba(250,247,239,.20) 56%, rgba(244,239,226,.66) 100%);
    }

    .watch .backdrop {
      background: url("assets/forest-tea-background.png") center / cover no-repeat;
      filter: saturate(.76) brightness(.76);
      transform: scale(1.02);
    }

    .watch .backdrop::after {
      background:
        radial-gradient(circle at 50% 55%, rgba(37,91,65,.28), transparent 45%),
        linear-gradient(180deg, rgba(5,44,31,.04), rgba(4,36,26,.42));
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .brand {
      position: absolute;
      top: 66px;
      left: 82px;
      display: flex;
      align-items: center;
      gap: 19px;
      color: var(--forest);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .20em;
    }

    .watch .brand { color: var(--cream); }

    .brand-mark {
      position: relative;
      display: block;
      width: 51px;
      height: 37px;
      border-radius: 65% 8% 65% 8%;
      background: currentColor;
      transform: rotate(-18deg);
    }

    .brand-mark::after {
      position: absolute;
      left: 4px;
      top: 17px;
      width: 47px;
      height: 3px;
      border-radius: 2px;
      background: currentColor;
      content: "";
      transform: rotate(23deg);
      opacity: .42;
      mix-blend-mode: screen;
    }

    h1 {
      position: absolute;
      top: 166px;
      left: 82px;
      width: 1080px;
      margin: 0;
      color: var(--forest-deep);
      font-family: "New York", Georgia, serif;
      font-size: 118px;
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: .94;
    }

    .watch h1 { color: var(--cream); }

    .subhead {
      position: absolute;
      top: 428px;
      left: 84px;
      width: 980px;
      margin: 0;
      color: #627268;
      font-size: 42px;
      font-weight: 450;
      letter-spacing: .004em;
      line-height: 1.25;
    }

    .watch .subhead {
      top: 434px;
      width: 830px;
      color: rgba(248,243,232,.78);
    }

    .phone {
      position: absolute;
      top: 818px;
      left: 174px;
      width: 936px;
      height: 2034px;
      padding: 15px;
      overflow: hidden;
      border-radius: 116px 116px 0 0;
      background: linear-gradient(105deg, #101614 0%, #4e5752 18%, #0a0d0c 44%, #525c57 72%, #101412 100%);
      box-shadow:
        0 46px 90px rgba(16,42,31,.24),
        0 8px 26px rgba(16,42,31,.18),
        inset 0 0 0 2px rgba(255,255,255,.28);
    }

    .phone::before {
      position: absolute;
      inset: 7px;
      z-index: 2;
      border: 3px solid rgba(255,255,255,.18);
      border-radius: 110px 110px 0 0;
      content: "";
      pointer-events: none;
    }

    .phone img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 98px 98px 0 0;
    }

    .phone-glow {
      position: absolute;
      top: 760px;
      left: 220px;
      width: 840px;
      height: 220px;
      border-radius: 50%;
      background: rgba(88,138,74,.22);
      filter: blur(78px);
      z-index: 1;
    }

    .watch-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .watch-case {
      position: absolute;
      width: 590px;
      height: 702px;
      padding: 18px;
      border-radius: 151px;
      background:
        linear-gradient(135deg, #c8cbc8 0%, #565b59 12%, #111514 27%, #767b79 48%, #151918 72%, #9da19f 91%, #2d3230 100%);
      box-shadow:
        0 62px 95px rgba(0,0,0,.50),
        0 14px 28px rgba(0,0,0,.36),
        inset 0 0 0 3px rgba(255,255,255,.42);
    }

    .watch-case::before {
      position: absolute;
      inset: 10px;
      z-index: 3;
      border: 3px solid rgba(255,255,255,.20);
      border-radius: 143px;
      content: "";
      pointer-events: none;
    }

    .watch-case::after {
      position: absolute;
      right: -38px;
      top: 208px;
      width: 34px;
      height: 114px;
      border-radius: 12px 20px 20px 12px;
      background: linear-gradient(90deg, #1c211f, #a0a4a2 56%, #353a38);
      box-shadow: 8px 10px 18px rgba(0,0,0,.30);
      content: "";
    }

    .watch-screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 9px solid #030504;
      border-radius: 133px;
      background: #000;
    }

    .watch-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timer-watch {
      top: 910px;
      left: 30px;
      transform: rotate(-7deg);
    }

    .favorites-watch {
      top: 1370px;
      right: 22px;
      transform: rotate(7deg) scale(.92);
    }

    .watch-case .side-button {
      position: absolute;
      right: -23px;
      top: 346px;
      width: 22px;
      height: 86px;
      border-radius: 8px 13px 13px 8px;
      background: linear-gradient(90deg, #1c211f, #777c79 58%, #292e2c);
      box-shadow: 6px 8px 15px rgba(0,0,0,.28);
    }

    .watch-chip {
      position: absolute;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 19px 27px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(7,44,31,.72);
      color: var(--cream);
      font-size: 29px;
      font-weight: 700;
      letter-spacing: .01em;
      box-shadow: 0 18px 42px rgba(0,0,0,.20);
      backdrop-filter: blur(16px);
    }

    .watch-chip::before {
      display: grid;
      width: 41px;
      height: 41px;
      place-items: center;
      border-radius: 50%;
      background: rgba(150,190,144,.24);
      color: #b9d7b4;
      font-size: 23px;
      content: "✓";
    }

    .chip-haptic { left: 82px; bottom: 235px; }
    .chip-favorites { right: 82px; bottom: 116px; }

    .fine-print {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 38px;
      z-index: 4;
      color: rgba(248,243,232,.52);
      font-size: 20px;
      letter-spacing: .02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="canvas hero" aria-label="Never oversteep again">
    <div class="backdrop"></div>
    <div class="content">
      <div class="brand"><span class="brand-mark"></span><span>STEEPR</span></div>
      <h1>Never oversteep<br>again.</h1>
      <p class="subhead">A calm timer that keeps every cup right on time.</p>
      <div class="phone-glow"></div>
      <div class="phone">
        <img src="../raw/04-active-timer.png" alt="Steepr Matcha timer">
      </div>
    </div>
  </section>

  <section class="canvas watch" aria-label="Brew from your wrist">
    <div class="backdrop"></div>
    <div class="content">
      <div class="brand"><span class="brand-mark"></span><span>STEEPR</span></div>
      <h1>Brew from<br>your wrist.</h1>
      <p class="subhead">Start, pause, and feel when it’s ready on Apple Watch.</p>
    </div>
    <div class="watch-stage">
      <div class="watch-case timer-watch">
        <div class="watch-screen"><img src="../watch-raw/01-timer.png" alt="Apple Watch timer"></div>
        <span class="side-button"></span>
      </div>
      <div class="watch-case favorites-watch">
        <div class="watch-screen"><img src="../watch-raw/02-favorites.png" alt="Apple Watch favorites"></div>
        <span class="side-button"></span>
      </div>
      <div class="watch-chip chip-haptic">Haptic alerts</div>
      <div class="watch-chip chip-favorites">Favorite teas</div>
      <div class="fine-print">Apple Watch app included</div>
    </div>
  </section>

  <script>
    const shot = new URLSearchParams(location.search).get("shot");
    document.body.dataset.shot = shot === "watch" ? "watch" : "hero";
  </script>
</body>
</html>

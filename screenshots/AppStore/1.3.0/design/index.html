<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1284, initial-scale=1">
  <title>Steepr 1.3 personal timing artwork</title>
  <style>
    @font-face { font-family: "New York"; src: url("file:///System/Library/Fonts/NewYork.ttf"); }
    @font-face { font-family: "SF Pro"; src: url("file:///System/Library/Fonts/SFNS.ttf"); }
    :root { --forest: #123f2f; --cream: #f8f3e8; --sage: #b9ceb6; }
    * { box-sizing: border-box; }
    html, body {
      width: 1284px;
      height: 2778px;
      margin: 0;
      overflow: hidden;
      background: var(--forest);
    }
    body {
      position: relative;
      font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      background: url("assets/ivory-tea-background.png") center / cover no-repeat;
      filter: saturate(.72) brightness(.58) hue-rotate(78deg);
      transform: scale(1.03);
    }
    .backdrop::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        radial-gradient(circle at 82% 48%, rgba(133,177,118,.30), transparent 34%),
        linear-gradient(180deg, rgba(6,47,33,.18), rgba(5,39,28,.78));
    }
    .brand {
      position: absolute;
      z-index: 3;
      top: 66px;
      left: 82px;
      display: flex;
      align-items: center;
      gap: 19px;
      color: var(--cream);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .20em;
    }
    .brand-mark {
      position: relative;
      width: 51px;
      height: 37px;
      border-radius: 65% 8% 65% 8%;
      background: currentColor;
      transform: rotate(-18deg);
    }
    .brand-mark::after {
      position: absolute;
      left: 4px;
      top: 17px;
      width: 47px;
      height: 3px;
      border-radius: 2px;
      background: currentColor;
      content: "";
      transform: rotate(23deg);
      opacity: .42;
      mix-blend-mode: screen;
    }
    h1 {
      position: absolute;
      z-index: 3;
      top: 166px;
      left: 82px;
      width: 1100px;
      margin: 0;
      color: var(--cream);
      font-family: "New York", Georgia, serif;
      font-size: 112px;
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: .94;
    }
    .subhead {
      position: absolute;
      z-index: 3;
      top: 432px;
      left: 84px;
      width: 1010px;
      margin: 0;
      color: rgba(248,243,232,.78);
      font-size: 39px;
      font-weight: 450;
      line-height: 1.28;
    }
    .phone-glow {
      position: absolute;
      z-index: 1;
      top: 760px;
      left: 164px;
      width: 956px;
      height: 330px;
      border-radius: 50%;
      background: rgba(145,191,128,.35);
      filter: blur(92px);
    }
    .phone {
      position: absolute;
      z-index: 2;
      top: 790px;
      left: 174px;
      width: 936px;
      height: 2040px;
      padding: 15px;
      overflow: hidden;
      border-radius: 116px 116px 0 0;
      background: linear-gradient(105deg, #101614 0%, #66716c 18%, #090c0b 44%, #68736e 72%, #101412 100%);
      box-shadow: 0 58px 110px rgba(0,0,0,.42), 0 12px 34px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.30);
    }
    .phone::before {
      position: absolute;
      inset: 7px;
      z-index: 3;
      border: 3px solid rgba(255,255,255,.18);
      border-radius: 110px 110px 0 0;
      content: "";
      pointer-events: none;
    }
    .phone img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 98px 98px 0 0;
    }
    .timing-chip {
      position: absolute;
      z-index: 5;
      right: 54px;
      top: 690px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 30px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      background: rgba(248,243,232,.94);
      color: var(--forest);
      font-size: 29px;
      font-weight: 750;
      box-shadow: 0 20px 46px rgba(0,0,0,.26);
    }
    .timing-chip::before {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      background: rgba(52,132,76,.14);
      content: "+15";
      font-size: 16px;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="brand"><span class="brand-mark"></span><span>STEEPR</span></div>
  <h1>Learns your<br>perfect steep.</h1>
  <p class="subhead">Rate each cup and save a better time for next time.</p>
  <div class="phone-glow"></div>
  <div class="phone"><img src="../raw/03-learns-your-steep.png" alt="Steepr personal timing feedback"></div>
  <div class="timing-chip">Your timing · 2m 45s</div>
</body>
</html>

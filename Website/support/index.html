  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support - Steepr</title>
    <meta name="description" content="Get support for Steepr, the tea timer and brew guide for iPhone and Apple Watch, including the Watch app, Siri and Shortcuts, guided re-steeps, custom teas, widgets, iCloud sync, and purchase restore questions." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7faf4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111410" />
    <script>
      (() => {
        let storedTheme
        try {
          storedTheme = localStorage.getItem('steepr-theme')
        } catch {}
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : prefersDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="apple-itunes-app" content="app-id=6775478425" />
    <link rel="canonical" href="https://steepr.maskedsyntax.com/support/" />

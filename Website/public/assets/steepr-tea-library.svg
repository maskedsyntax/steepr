<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1947" viewBox="0 0 900 1947" role="img" aria-labelledby="title desc">
  <title id="title">Steepr tea library</title>
  <desc id="desc">Tea library with custom teas, built-in teas, and favorites.</desc>
  <rect width="900" height="1947" fill="#f7f5ed"/>
  <circle cx="805" cy="115" r="205" fill="#fff"/>
  <path d="M0 1500c205-80 322 60 520-15 150-56 219-190 380-166v628H0z" fill="#f3eadf"/>
  <text x="54" y="155" fill="#4a7c4e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="800">LIBRARY</text>
  <text x="54" y="300" fill="#090909" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="850">Keep your teas</text>
  <text x="54" y="388" fill="#090909" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="850">organized.</text>
  <text x="54" y="505" fill="#111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38">Add custom teas, favorite up to six,</text>
  <text x="54" y="555" fill="#111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38">and browse built-in presets.</text>
  <rect x="42" y="690" width="816" height="1110" rx="28" fill="#fff" stroke="#4a7c4e" stroke-width="7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1947" viewBox="0 0 900 1947" role="img" aria-labelledby="title desc">
  <title id="title">Steepr active timer</title>
  <desc id="desc">Active brew timer with pause and cancel controls.</desc>
  <rect width="900" height="1947" fill="#f7f5ed"/>
  <circle cx="805" cy="115" r="205" fill="#fff"/>
  <path d="M0 1500c210-76 328 55 520-18 150-56 220-188 380-162v627H0z" fill="#eaf4e6"/>
  <text x="54" y="155" fill="#4a7c4e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="800">ONE TAP TIMER</text>
  <text x="54" y="300" fill="#090909" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="850">A clear timer,</text>
  <text x="54" y="388" fill="#090909" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="850">without clutter.</text>
  <text x="54" y="505" fill="#111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38">Pause, resume, cancel, or re-steep</text>
  <text x="54" y="555" fill="#111" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38">when the cup is ready.</text>
  <rect x="84" y="675" width="732" height="1080" rx="34" fill="#fff" stroke="#4a7c4e" stroke-width="7" transform="rotate(2 450 1215)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <text x="450" y="775" font-size="32" font-weight="750">Brew</text>
    <circle cx="450" cy="1115" r="270" fill="none" stroke="#efe4dc" stroke-width="20"/>
    <path d="M450 845a270 270 0 0 1 235 137" fill="none" stroke="#b8732f" stroke-width="20" stroke-linecap="round"/>
    <text x="450" y="1160" font-size="118" font-weight="850">2:49</text>
    <text x="450" y="1470" font-size="50" font-weight="850">Oolong</text>
    <text x="450" y="1530" font-size="34" fill="#8a8d93">90°C</text>
    <text x="450" y="1580" font-size="28" fill="#8a8d93">Infusion 1</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">
    <rect x="225" y="1635" width="195" height="64" rx="32" fill="#4a7c4e"/><text x="255" y="1678" fill="#fff">Ⅱ Pause</text>
    <rect x="455" y="1635" width="205" height="64" rx="32" fill="#e5eee4"/><text x="500" y="1678" fill="#4a7c4e">× Cancel</text>
  </g>
</svg>

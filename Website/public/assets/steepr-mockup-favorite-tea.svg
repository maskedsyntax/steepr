<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1947" viewBox="0 0 900 1947" role="img" aria-labelledby="title desc">
  <title id="title">Brew your favorite tea</title><desc id="desc">Brew screen with favorite teas and brewing parameters.</desc><rect width="900" height="1947" fill="#f7faf3"/><text x="110" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="76" font-weight="900">Brew your</text><text x="110" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="76" font-weight="900" fill="#2f6f38">favorite tea.</text><text x="110" y="455" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" fill="#171917">Curated teas with the right</text><text x="110" y="505" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" fill="#171917">time and temperature.</text><g transform="translate(145 580)"><rect width="610" height="1220" rx="72" fill="#101110"/><rect x="24" y="24" width="562" height="1172" rx="56" fill="#fff"/><rect x="230" y="58" width="150" height="44" rx="22" fill="#050505"/><text x="305" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="800">Brew</text><text x="305" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="900">What are you</text><text x="305" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="900">brewing?</text><text x="305" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" fill="#686b70">Start a favorite tea or browse</text><text x="305" y="432" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" fill="#686b70">the full library.</text><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><g transform="translate(72 480)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#e4eee4"/><text x="28" y="115" font-size="28" font-weight="850">Green</text><text x="28" y="150" font-size="22" fill="#60656b">2m 30s · 80°C</text></g><g transform="translate(328 480)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#e4dfdc"/><text x="28" y="115" font-size="28" font-weight="850">Black</text><text x="28" y="150" font-size="22" fill="#60656b">4m · 95°C</text></g><g transform="translate(72 680)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#f3e8dc"/><text x="28" y="115" font-size="28" font-weight="850">Oolong</text><text x="28" y="150" font-size="22" fill="#60656b">3m 30s · 90°C</text></g><g transform="translate(328 680)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#f0dde6"/><text x="28" y="115" font-size="28" font-weight="850">Herbal</text><text x="28" y="150" font-size="22" fill="#60656b">5m · 100°C</text></g><g transform="translate(72 880)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#eee2d7"/><text x="28" y="115" font-size="28" font-weight="850">Chai</text><text x="28" y="150" font-size="22" fill="#60656b">5m · 100°C</text></g><g transform="translate(328 880)"><rect width="210" height="170" rx="18" fill="#fff" stroke="#ddd"/><circle cx="58" cy="58" r="38" fill="#e8efd7"/><text x="28" y="115" font-size="28" font-weight="850">Matcha</text><text x="28" y="150" font-size="22" fill="#60656b">30s · 75°C</text></g></g><rect x="72" y="1090" width="466" height="70" rx="35" fill="#f0f2ef"/><text x="305" y="1135" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#2f6f38">Browse all teas</text></g></svg>

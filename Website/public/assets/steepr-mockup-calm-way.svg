  <text x="120" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="78" font-weight="900">way to</text>
  <text x="120" y="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="78" font-weight="900" fill="#2f6f38">make tea.</text>

7" y="835" text-anchor="middle" font-size="28" font-weight="800">Sip</text><text x="177" y="872" text-anchor="middle" font-size="22" fill="#686b70">Get a gentle alert</text><rect x="328" y="710" width="210" height="190" rx="18" fill="#fff" stroke="#e4e5e1"/><text x="433" y="780" text-anchor="middle" font-size="30" font-weight="900" fill="#2f6f38">Next</text><text x="433" y="835" text-anchor="middle" font-size="28" font-weight="800">Repeat</text><text x="433" y="872" text-anchor="middle" font-size="22" fill="#686b70">Guide second cups</text></g><rect x="205" y="948" width="200" height="64" rx="32" fill="#2f6f38"/><text x="305" y="990" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">Get started</text></g>

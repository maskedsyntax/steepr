<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1947" viewBox="0 0 900 1947" role="img" aria-labelledby="title desc"><title id="title">Gentle alert when ready</title><desc id="desc">Completion screen with re-steep and done buttons.</desc><rect width="900" height="1947" fill="#f7faf3"/><text x="95" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="74" font-weight="900">Gentle alert</text><text x="95" y="370" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="74" font-weight="900" fill="#2f6f38">when it's ready.</text><text x="105" y="475" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40">A single, calm notification.</text><text x="105" y="525" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40">No noise, no repeats.</text><g transform="translate(145 620)"><rect width="610" height="1200" rx="72" fill="#101110"/><rect x="24" y="24" width="562" height="1152" rx="56" fill="#fff"/><rect x="230" y="58" width="150" height="44" rx="22" fill="#050505"/><circle cx="305" cy="470" r="92" fill="#e7efe5"/><text x="305" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="900" fill="#4f9d28">Alert</text><text x="305" y="690" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="900">Your Matcha is ready</text><text x="305" y="780" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#60656b">Steeped for 30s.</text><text x="305" y="840" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" fill="#60656b">Infusion 1 complete</text><rect x="95" y="935" width="210" height="70" rx="35" fill="#3d7b3f"/><text x="200" y="980" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="850" fill="#fff">Re-steep</text><rect x="335" y="935" width="180" height="70" rx="35" fill="#eef2ec"/><text x="425" y="980" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="850" fill="#2f6f38">Done</text></g></svg>
